name: Deploy Supabase create-student Function

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirm production deployment of create-student"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-create-student-production
  cancel-in-progress: false

jobs:
  deploy-create-student:
    if: inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify function source exists
        shell: bash
        run: |
          test -s supabase/functions/create-student/index.ts
          echo "Verified create-student source file."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy only create-student
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" || -z "${SUPABASE_PROJECT_REF}" ]]; then
            echo "::error::Required GitHub Actions secrets are missing."
            exit 1
          fi
          supabase functions deploy create-student \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --use-api \
            --yes
