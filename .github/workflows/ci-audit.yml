name: WESSAM Academy - CI & Supabase Readiness Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - setup/github-actions-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wessam-academy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, Build & Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No package-lock.json currently exists, so npm ci/cache-by-lockfile
      # would be invalid. Keep npm install until a lockfile is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify required Supabase project files
        shell: bash
        run: |
          set -euo pipefail

          test -f supabase/config.toml
          grep -Fq 'project_id = "xdmspkzsaukagtkydsbw"' supabase/config.toml

          for migration in \
            20261103000001_initial_schema.sql \
            20261103000002_add_super_admin_role.sql \
            20261103000003_super_admin_functions_and_rpc.sql \
            20261103000004_harden_student_isolation_and_functions.sql \
            20261103000005_complete_rls_active_student_hardening.sql \
            20261103000006_student_group_management_rpcs.sql \
            20261104000001_soft_archive_groups.sql \
            20261104000002_harden_group_archive_authorization.sql \
            20261104000003_secure_archive_rpc_authorization.sql \
            20261104000004_minimize_archive_authorization_privileges.sql
          do
            test -f "supabase/migrations/$migration" || {
              echo "::error::Missing migration: $migration"
              exit 1
            }
          done

          for fn in create-student student-login reset-student-password; do
            test -f "supabase/functions/$fn/index.ts" || {
              echo "::error::Missing Edge Function: $fn"
              exit 1
            }
          done

          node -e "const p=require('./package.json'); if (!p.scripts?.['bootstrap:super-admin']) process.exit(1)"
          test -f scripts/bootstrap-super-admin.ts

          echo "Supabase config, migrations, Edge Functions, and bootstrap entrypoint verified."

      - name: Report security and migration review items
        shell: bash
        run: |
          set -u
          LOGIN_FILE="supabase/functions/student-login/index.ts"
          GROUP_MIGRATION="supabase/migrations/20261103000006_student_group_management_rpcs.sql"

          if grep -Fq 'wessam-academy-default-salt-fallback' "$LOGIN_FILE"; then
            echo "::error::Hardcoded HMAC fallback is forbidden."
            exit 1
          fi

          grep -Fq 'hmacSha256Hex(data: string, secret: string)' "$LOGIN_FILE" || {
            echo "::error::HMAC helper must receive the dedicated secret explicitly."
            exit 1
          }

          grep -Fq 'RATE_LIMIT_HMAC_SECRET' "$LOGIN_FILE" || {
            echo "::error::student-login must require RATE_LIMIT_HMAC_SECRET."
            exit 1
          }

          grep -Fq 'byteLength < 32' "$LOGIN_FILE" || {
            echo "::error::RATE_LIMIT_HMAC_SECRET must have at least 32 bytes."
            exit 1
          }

          if grep -Fq 'pg_catalog.nullif' "$GROUP_MIGRATION" || grep -Fq 'pg_catalog.trim' "$GROUP_MIGRATION"; then
            echo "::error::Use NULLIF(...) and pg_catalog.btrim(...) in migration 000006."
            exit 1
          fi

          if grep -Fq 'pg_catalog.auth.uid()' "$GROUP_MIGRATION"; then
            echo "::error::Supabase auth.uid() belongs to the auth schema, not pg_catalog."
            exit 1
          fi

          grep -Fq 'auth.uid()' "$GROUP_MIGRATION" || {
            echo "::error::Group RPCs must resolve the authenticated caller with auth.uid()."
            exit 1
          }

          grep -Fq 'Student is not enrolled in the source group' "$GROUP_MIGRATION" || {
            echo "::error::Transfer RPC must require source-group membership."
            exit 1
          }

          grep -Fq 'Student is not enrolled in the specified group' "$GROUP_MIGRATION" || {
            echo "::error::Remove RPC must reject missing group membership."
            exit 1
          }

          grep -Fq 'target user is not a student' "$GROUP_MIGRATION" || {
            echo "::error::Group management RPCs must validate the target student role."
            exit 1
          }

          LOCK_COUNT="$(grep -Eic 'FOR[[:space:]]+UPDATE' "$GROUP_MIGRATION" || true)"
          if [ "$LOCK_COUNT" -lt 2 ]; then
            echo "::warning::Expected row locks in both enrollment and transfer capacity checks were not detected. Review concurrent capacity enforcement."
          else
            echo "Row-lock clauses detected: $LOCK_COUNT"
          fi

          echo "Read-only readiness audit completed. No Supabase resources were changed."
