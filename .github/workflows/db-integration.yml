name: WESSAM Academy - Supabase Database Integration Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/db-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wessam-db-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-integration:
    name: Local Supabase Migrations & RPC Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Apply every migration to the disposable database
        run: supabase db reset

      - name: Run pgTAP group-management integration tests
        run: supabase test db

      - name: Install PostgreSQL client for concurrency test
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify concurrent enrollment cannot exceed group capacity
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          if [ -z "$DB_URL" ]; then
            echo "::error::Could not read the local Supabase DB_URL."
            exit 1
          fi
          DB_URL="$DB_URL" bash supabase/tests/database/group_management_concurrency.sh

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
